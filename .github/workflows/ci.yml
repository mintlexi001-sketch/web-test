name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Audit & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend — Audit, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Lint (zero warnings allowed)
        run: npm run lint
      - name: Production build
        env:
          # Stub env vars for both fail-closed guards (api.js + supabase.js).
          # NOT real secrets — dummy values used only for the build step.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
          VITE_API_URL: https://placeholder-api.example.com
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_PERMANENT_ADMIN_EMAIL: ci@example.com
        run: npm run build
