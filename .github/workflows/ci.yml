name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Audit & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

  frontend:
    name: Frontend — Audit, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Lint (zero warnings allowed)
        run: npm run lint
      - name: Production build
        env:
          # Provide stub env vars so the fail-closed api.js guard doesn't fire during CI build.
          # These are NOT real secrets — they're dummy values used only for the build step.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_key
          VITE_API_URL: http://localhost:3001
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_PERMANENT_ADMIN_EMAIL: ci@example.com
        run: npm run build
