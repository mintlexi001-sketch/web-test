# render.yaml — Render deployment config for the backend
# Reference: https://render.com/docs/blueprint-spec
#
# To use: link your GitHub repo in the Render dashboard and this file
# will be detected automatically (Infrastructure as Code / Blueprint).
# Alternatively, you can configure the service manually via the dashboard.

services:
  - type: web
    name: ss-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (never hardcode secrets here):
      # EMAIL_USER, EMAIL_PASS, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
      # APP_URL, FRONTEND_URL, TURNSTILE_SECRET_KEY, SENTRY_DSN (optional)
